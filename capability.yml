version: '1'
name: local-image-tagger
options:
  vision_model:
    kind: string
    default: ggml-org/SmolVLM-256M-Instruct-GGUF:Q8_0
    description: Vision-capable GGUF/Hugging Face model spec used for image tagging.
  llama_context_size:
    kind: number
    default: 8192
    description: Context size passed through to the bundled llama.cpp dependency.
  gpu:
    kind: enum
    enum_values:
    - none
    - metal
    default: metal
    description: Local GPU acceleration mode for the bundled llama.cpp dependency.
dependencies:
  llama:
    source: !LocalPackage
      path: ../llama-cpp-local
    target: !BundledChild
      team_name: local-llama-cpp
      lifecycle: applied
      profile_name: local
      connectivity: same_host_loopback
    mount_bindings:
      models: models
    options:
      default_model:
        from_option: vision_model
      context_size:
        from_option: llama_context_size
      gpu:
        from_option: gpu
host_mounts:
  images:
    usage: Folder of local images to tag
    access: read_only
  models:
    usage: Local GGUF model cache for the bundled llama.cpp dependency
    access: read_write
workloads:
  llama:
    import:
      dependency: llama
      export: oaic
  tagger:
    connections:
    - llama
    mounts:
    - mount_mid: images
      access: read_only
    endpoints:
    - mcp
    runtime:
      source:
        toolchain: bun
        prepare:
          command: bun install
          allow_network: true
        start:
          command: bun run src/index.ts
          env_from_options:
            LOCAL_IMAGE_TAGGER_MODEL: vision_model
expose:
- path: /mcp
  target: tagger
  endpoints:
  - mcp
  default_mcp: true
