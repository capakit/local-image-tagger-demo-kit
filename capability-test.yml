tests:
  - id: tags-fixture-image-with-local-vision-model
    kind: mcp
    target:
      exposed_path: /mcp
    request:
      tool: tag_image
      inputs:
        image_path: sample.png
        max_tags: 8
    verbose_output:
      - $.image
      - $.model
      - $.tags
    validations:
      - $.image.eq("sample.png")
      - $.model.exists()
      - $.tags.lenGte(1)
